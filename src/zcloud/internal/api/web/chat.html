<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZCloud Chat</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
/* === Design tokens — xem docs/design.md Phần B2 === */
:root {
  /* === Brand === */
  --c-brand: #0068ff;
  --c-brand-hover: #0052cc;
  --c-brand-soft: #e8f0ff;
  /* === Neutral === */
  --c-text: #1a1a1a;
  --c-text-2: #4a4a4a;
  --c-text-3: #888;
  --c-text-onbrand: #fff;
  --c-bg: #f5f5f7;
  --c-surface: #fff;
  --c-surface-2: #f0f0f2;
  --c-border: #e0e0e3;
  --c-border-2: #d0d0d3;
  /* === Semantic === */
  --c-success: #2e7d32;
  --c-success-soft: #e8f5e9;
  --c-success-glow: rgba(46,125,50,.45);
  --c-warning: #f57c00;
  --c-warning-glow: rgba(245,124,0,.45);
  --c-danger: #c62828;
  --c-danger-soft: #ffebee;
  --c-info: #0277bd;
  --c-info-soft: #e8f4fd;
  /* === Overlay === */
  --c-overlay: rgba(0,0,0,.5);
  --c-overlay-soft: rgba(0,0,0,.25);
  --c-overlay-strong: rgba(0,0,0,.85);
  --c-onbrand-trans: rgba(0,104,255,.15);
  --c-onbrand-soft: rgba(255,255,255,.85);
  /* === Brand translucent (gradient nền, badge trên brand) === */
  --c-brand-trans-08: rgba(0,104,255,.08);
  --c-brand-trans-05: rgba(0,104,255,.05);
  /* === Spacing === */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-7: 32px; --s-8: 48px;
  /* === Radius === */
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-pill: 999px;
  /* === Shadow === */
  --sh-1: 0 1px 2px rgba(0,0,0,.06);
  --sh-2: 0 2px 8px rgba(0,0,0,.08);
  --sh-3: 0 8px 24px rgba(0,0,0,.12);
  --sh-4: 0 16px 48px rgba(0,0,0,.16);
  /* === Typography === */
  --ff-base: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", sans-serif;
  --ff-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fz-xs: 11px; --fz-sm: 12px; --fz-md: 14px; --fz-lg: 16px;
  --fz-xl: 20px; --fz-2xl: 28px;
  --lh: 1.5; --fw-r: 400; --fw-m: 500; --fw-b: 600;
  /* === Layout === */
  --sb-w: 60px; --pn-w: 320px; --hdr-h: 56px; --input-h: 40px;
  /* === Animation === */
  --ease: cubic-bezier(.2,.8,.2,1);
  --dur-1: 150ms; --dur-2: 250ms;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ff-base);font-size:var(--fz-md);line-height:var(--lh);
  color:var(--c-text);background:var(--c-bg);
  display:flex;flex-direction:column;
}

/* === Header === */
.hdr{
  height:var(--hdr-h);
  background:var(--c-surface);
  border-bottom:1px solid var(--c-border);
  padding:0 var(--s-4);
  display:flex;align-items:center;gap:var(--s-3);
  flex-shrink:0;
}
.ha{
  width:32px;height:32px;border-radius:var(--r-pill);
  background:var(--c-surface-2);overflow:hidden;flex-shrink:0;
}
.ha img{width:100%;height:100%;object-fit:cover}
.hdr h1{font-size:var(--fz-lg);font-weight:var(--fw-m);color:var(--c-text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr a{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--r-md);transition:background var(--dur-1) var(--ease)}
.hdr a:hover{background:var(--c-surface-2)}

/* === Layout === */
.ct{flex:1;display:flex;overflow:hidden;min-height:0}

/* === Sidebar === */
.sb{
  width:var(--sb-w);background:var(--c-surface);
  border-right:1px solid var(--c-border);
  display:flex;flex-direction:column;align-items:center;
  padding:var(--s-2) 0;flex-shrink:0;
}
.sb-bot{margin-top:auto}
.sb-div{width:32px;height:1px;background:var(--c-border);margin:var(--s-2) 0}
.sb-btn{
  width:40px;height:40px;border:none;background:transparent;
  cursor:pointer;border-radius:var(--r-md);font-size:20px;
  color:var(--c-text-2);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:var(--s-1);transition:all var(--dur-1) var(--ease);
}
.sb-btn:hover{background:var(--c-brand-soft);color:var(--c-brand)}
.sb-btn.on{background:var(--c-brand);color:var(--c-text-onbrand)}
.sb-btn:focus-visible{outline:2px solid var(--c-brand);outline-offset:2px}

/* === Panels === */
.sp{
  flex:0 0 var(--pn-w);display:none;flex-direction:column;
  background:var(--c-surface);border-right:1px solid var(--c-border);
  min-height:0;overflow:hidden;
}
.sp.on{display:flex}

.sr{padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--c-border);flex-shrink:0}
.sr input{
  width:100%;height:36px;padding:0 var(--s-3);
  border:1px solid var(--c-border-2);border-radius:var(--r-md);
  background:var(--c-surface-2);color:var(--c-text);
  font-size:var(--fz-md);font-family:inherit;outline:none;
  transition:all var(--dur-1) var(--ease);
}
.sr input:focus{background:var(--c-surface);border-color:var(--c-brand)}

#cl,#fl,#ul{flex:1;overflow-y:auto;padding:var(--s-1) 0}
.cv{
  display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-3) var(--s-4);cursor:pointer;
  border-bottom:1px solid var(--c-bg);
  transition:background var(--dur-1) var(--ease);
}
.cv:hover{background:var(--c-surface-2)}
.cv.on{background:var(--c-brand-soft)}
.cv-a{
  width:40px;height:40px;border-radius:var(--r-pill);
  overflow:hidden;flex-shrink:0;background:var(--c-surface-2);
}
.cv-a img{width:100%;height:100%;object-fit:cover}
.cv-b{flex:1;min-width:0}
.cv-n{font-size:var(--fz-md);font-weight:var(--fw-m);color:var(--c-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-p{font-size:var(--fz-xs);color:var(--c-text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* === Mgmt panel === */
.mg-h{
  background:var(--c-bg);padding:var(--s-3) var(--s-4);
  border-bottom:1px solid var(--c-border);
  font-size:var(--fz-sm);font-weight:var(--fw-b);
  color:var(--c-text-2);text-transform:uppercase;letter-spacing:.5px;
}
.mg-toolbar{
  display:flex;gap:var(--s-2);padding:var(--s-3) var(--s-4);
  border-bottom:1px solid var(--c-border);background:var(--c-surface);
  position:sticky;top:0;z-index:1;
}
.mg-toolbar input{
  flex:1;height:36px;padding:0 var(--s-3);
  border:1px solid var(--c-border-2);border-radius:var(--r-md);
  background:var(--c-surface);color:var(--c-text);
  font-size:var(--fz-md);font-family:inherit;outline:none;
}
.mg-toolbar input:focus{border-color:var(--c-brand)}
.mg-toolbar button{
  height:36px;padding:0 var(--s-4);background:var(--c-brand);
  color:var(--c-text-onbrand);border:none;border-radius:var(--r-md);
  cursor:pointer;font-size:var(--fz-md);font-weight:var(--fw-m);
  font-family:inherit;transition:background var(--dur-1) var(--ease);
}
.mg-toolbar button:hover{background:var(--c-brand-hover)}
.mg-stats{
  padding:var(--s-2) var(--s-4);background:var(--c-bg);
  font-size:var(--fz-xs);color:var(--c-text-3);
  border-bottom:1px solid var(--c-border);
}
.mg-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:var(--s-7) var(--s-4);color:var(--c-text-3);
  font-size:var(--fz-sm);gap:var(--s-2);line-height:var(--lh);
}
.mg-empty-i{font-size:40px;opacity:.5}
.mg-empty-sub{margin-top:var(--s-2);font-size:var(--fz-xs);color:var(--c-text-3)}
.mg-item{
  display:flex;align-items:stretch;gap:var(--s-3);
  padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--c-bg);
  transition:background var(--dur-1) var(--ease);
}
.mg-item:hover{background:var(--c-surface-2)}
.mg-item.cur{background:var(--c-brand-soft)}
.mg-item.cur:hover{background:var(--c-brand-soft)}
.mg-item .mg-av{
  width:44px;height:auto;align-self:stretch;border-radius:var(--r-pill);
  overflow:hidden;background:var(--c-surface-2);
  flex-shrink:0;min-height:44px;
}
.mg-item .mg-av img{width:100%;height:100%;object-fit:cover}
.mg-item .mg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s-1)}
.mg-item .mg-row1{display:flex;align-items:center;gap:var(--s-2);min-width:0}
.mg-item .mg-row2{display:flex;align-items:center;gap:var(--s-2);min-width:0}
.mg-item .mg-row3{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;min-width:0}
.mg-item .mg-st{width:8px;height:8px;border-radius:var(--r-pill);flex-shrink:0}
.mg-item .mg-st.on{background:var(--c-success);box-shadow:0 0 6px var(--c-success-glow)}
.mg-item .mg-st.off{background:var(--c-text-3)}
.mg-item .mg-st.err{background:var(--c-warning);box-shadow:0 0 6px var(--c-warning-glow)}
.mg-item .mg-n{font-size:var(--fz-md);font-weight:var(--fw-b);color:var(--c-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mg-item .mg-meta{font-size:var(--fz-xs);color:var(--c-text-3);font-family:var(--ff-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mg-item .mg-cur{
  font-size:var(--fz-xs);color:var(--c-brand);font-weight:var(--fw-b);
  padding:1px var(--s-2);border-radius:var(--r-pill);
  background:var(--c-surface);border:1px solid var(--c-brand);
  flex-shrink:0;
}
.mg-item .mg-btn{
  height:24px;padding:0 var(--s-2);background:transparent;
  color:var(--c-brand);border:1px solid var(--c-brand);
  border-radius:var(--r-sm);cursor:pointer;
  font-size:var(--fz-xs);font-weight:var(--fw-m);font-family:inherit;
  transition:all var(--dur-1) var(--ease);
}
.mg-item .mg-btn:hover{background:var(--c-brand);color:var(--c-text-onbrand)}
.mg-item .mg-btn.cur{
  background:var(--c-brand);color:var(--c-text-onbrand);cursor:default;
}
.mg-item .mg-del{
  height:24px;padding:0 var(--s-2);background:transparent;
  color:var(--c-danger);border:1px solid var(--c-danger);
  border-radius:var(--r-sm);cursor:pointer;
  font-size:var(--fz-xs);font-weight:var(--fw-m);font-family:inherit;
  transition:all var(--dur-1) var(--ease);
}
.mg-item .mg-del:hover{background:var(--c-danger);color:var(--c-text-onbrand)}

/* === Chat area === */
.ca{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--c-bg)}
.ch{
  height:var(--hdr-h);padding:0 var(--s-5);background:var(--c-surface);
  border-bottom:1px solid var(--c-border);
  display:flex;align-items:center;flex-shrink:0;
}
.ch h2{font-size:var(--fz-md);font-weight:var(--fw-m);color:var(--c-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ms{
  flex:1;overflow-y:auto;padding:var(--s-5);
  display:flex;flex-direction:column;gap:var(--s-2);
  scroll-behavior:smooth;
}

/* === Empty state === */
.em{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:var(--c-text-3);gap:var(--s-3);
  font-size:48px;
}
.em-text{font-size:var(--fz-md);color:var(--c-text-3)}

/* === Chat bubble === */
.msg{
  max-width:70%;padding:var(--s-2) var(--s-3);
  border-radius:var(--r-md);font-size:var(--fz-md);line-height:var(--lh);
  word-wrap:break-word;
}
.msg.in{
  background:var(--c-surface);align-self:flex-start;
  border-bottom-left-radius:var(--r-sm);
  box-shadow:var(--sh-1);
}
.msg.out{
  background:var(--c-brand);color:var(--c-text-onbrand);
  align-self:flex-end;border-bottom-right-radius:var(--r-sm);
}
.msg .nm{
  font-size:var(--fz-sm);color:var(--c-brand);font-weight:var(--fw-m);
  margin-bottom:2px;
}
.msg .tm{
  font-size:var(--fz-xs);opacity:.6;margin-top:var(--s-1);text-align:right;
}
.msg.out .tm{color:var(--c-onbrand-soft)}

.msg .imgs{display:flex;flex-wrap:wrap;gap:var(--s-1);margin-top:var(--s-1)}
.msg .imgs .img{
  width:160px;height:160px;object-fit:cover;border-radius:var(--r-md);
  cursor:pointer;background:var(--c-surface-2);display:block;
  transition:transform var(--dur-1) var(--ease);
}
.msg .imgs .img:hover{transform:scale(1.02)}
.msg .imgs.imgs-1 .img{width:auto;height:auto;max-width:320px;max-height:320px}
.msg .imgs.imgs-2-3 .img{width:calc(50% - 2px);height:160px}
.msg .imgs.imgs-4p .img{width:calc(33.333% - 3px);height:120px}
.msg .imgs .img-spinner,.msg .imgs .img-err{
  width:160px;height:160px;display:flex;align-items:center;
  justify-content:center;background:var(--c-surface-2);border-radius:var(--r-md);
  color:var(--c-text-3);font-size:var(--fz-sm);text-align:center;padding:var(--s-2);
}
.msg .imgs .img-err{color:var(--c-danger);background:var(--c-danger-soft)}

.msg video.media{max-width:320px;max-height:320px;border-radius:var(--r-md);display:block;margin-top:var(--s-1)}
.msg a.file{
  display:inline-flex;align-items:center;gap:var(--s-2);
  margin-top:var(--s-1);padding:var(--s-2) var(--s-3);
  background:var(--c-brand-soft);color:var(--c-brand);
  border-radius:var(--r-sm);font-weight:var(--fw-m);font-size:var(--fz-sm);
  text-decoration:none;
}
.msg.out a.file{background:var(--c-onbrand-trans);color:var(--c-text-onbrand)}

/* === Delivery ack badge === */
.msg.ack{
  max-width:60%;padding:var(--s-1) var(--s-3);font-size:var(--fz-sm);
  opacity:.85;align-self:center;border-radius:var(--r-pill);
  background:transparent;border:1px dashed var(--c-border);
  color:var(--c-text-2);text-align:center;line-height:1.3;
}
.msg.ack .ack-ic{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:var(--s-1);font-weight:var(--fw-b)}
.msg.ack .ack-tx{font-weight:var(--fw-m)}
.msg.ack.sent{color:var(--c-text-3)}
.msg.ack.delivered{color:var(--c-success);border-color:var(--c-success)}
.msg.ack.seen{color:var(--c-info);border-color:var(--c-info)}
.msg.ack.unsent{color:var(--c-danger);border-color:var(--c-danger)}
.msg.ack .ack-id{font-size:var(--fz-xs);opacity:.5;margin-left:var(--s-1);font-family:var(--ff-mono)}

/* === Input area === */
.ia{
  display:flex;align-items:center;gap:var(--s-2);
  padding:var(--s-3) var(--s-4);background:var(--c-surface);
  border-top:1px solid var(--c-border);flex-shrink:0;
}
.ia input{
  flex:1;height:var(--input-h);padding:0 var(--s-3);
  border:1px solid var(--c-border-2);border-radius:var(--r-pill);
  background:var(--c-surface-2);color:var(--c-text);
  font-size:var(--fz-md);font-family:inherit;outline:none;
  transition:all var(--dur-1) var(--ease);
}
.ia input:focus{background:var(--c-surface);border-color:var(--c-brand)}
.ia button{
  height:var(--input-h);padding:0 var(--s-5);
  background:var(--c-brand);color:var(--c-text-onbrand);
  border:none;border-radius:var(--r-pill);
  font-size:var(--fz-md);font-weight:var(--fw-m);
  font-family:inherit;cursor:pointer;
  transition:background var(--dur-1) var(--ease);
}
.ia button:hover{background:var(--c-brand-hover)}

/* === Load more / end markers === */
.lm{text-align:center;padding:var(--s-2);color:var(--c-brand);cursor:pointer;font-size:var(--fz-sm)}
.lm:hover{text-decoration:underline}
.lm-end{text-align:center;padding:var(--s-2);color:var(--c-text-3);font-size:var(--fz-xs);opacity:.6}
.lm-load{
  text-align:center;padding:var(--s-1);color:var(--c-brand);
  font-size:var(--fz-xs);opacity:.8;
}
.lm-load::before{
  content:'';display:inline-block;width:10px;height:10px;
  border:2px solid var(--c-brand);border-right-color:transparent;
  border-radius:var(--r-pill);animation:lm-spin .8s linear infinite;
  vertical-align:-1px;margin-right:var(--s-2);
}
@keyframes lm-spin{to{transform:rotate(360deg)}}

/* === Modal === */
.modal{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  animation:modal-fade var(--dur-2) var(--ease);
}
@keyframes modal-fade{from{opacity:0}to{opacity:1}}
.modal-bg{
  position:absolute;inset:0;background:var(--c-overlay);
}
.modal-card{
  position:relative;background:var(--c-surface);
  border-radius:var(--r-lg);width:380px;max-width:90vw;
  max-height:90vh;overflow:auto;box-shadow:var(--sh-3);
  animation:modal-pop var(--dur-2) var(--ease);
}
@keyframes modal-pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-h{
  display:flex;justify-content:space-between;align-items:center;
  padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--c-border);
  font-size:var(--fz-md);font-weight:var(--fw-m);
}
.modal-close{
  background:none;border:none;font-size:22px;cursor:pointer;
  color:var(--c-text-2);padding:0;width:28px;height:28px;
  line-height:1;border-radius:var(--r-sm);transition:background var(--dur-1) var(--ease);
}
.modal-close:hover{background:var(--c-surface-2);color:var(--c-text)}
.modal-tabs{display:flex;border-bottom:1px solid var(--c-border)}
.modal-tab{
  flex:1;background:none;border:none;padding:var(--s-3);
  cursor:pointer;font-size:var(--fz-sm);color:var(--c-text-2);
  border-bottom:2px solid transparent;font-family:inherit;
  transition:all var(--dur-1) var(--ease);
}
.modal-tab:hover{background:var(--c-bg)}
.modal-tab.on{color:var(--c-brand);border-bottom-color:var(--c-brand);font-weight:var(--fw-m)}
.modal-body{padding:var(--s-4);text-align:center}
.modal-body textarea{
  width:100%;padding:var(--s-2);border:1px solid var(--c-border-2);
  border-radius:var(--r-md);font-family:var(--ff-mono);font-size:var(--fz-sm);
  resize:vertical;box-sizing:border-box;outline:none;color:var(--c-text);
}
.modal-body textarea:focus{border-color:var(--c-brand)}
.qr-loading{padding:var(--s-7) 0;color:var(--c-text-3);font-size:var(--fz-sm)}
#qr-img{
  display:block;margin:0 auto;max-width:240px;height:auto;
  border:1px solid var(--c-border);border-radius:var(--r-md);
  padding:var(--s-2);background:var(--c-surface);
}
.qr-expire{padding:var(--s-5) 0;color:var(--c-danger);font-size:var(--fz-sm)}
.qr-hint{margin-top:var(--s-3);font-size:var(--fz-sm);color:var(--c-text-2);line-height:var(--lh);text-align:left}
.modal-primary{
  margin-top:var(--s-3);background:var(--c-brand);color:var(--c-text-onbrand);
  border:none;padding:var(--s-3) var(--s-5);border-radius:var(--r-md);
  cursor:pointer;font-size:var(--fz-md);font-weight:var(--fw-m);
  font-family:inherit;width:100%;transition:background var(--dur-1) var(--ease);
}
.modal-primary:hover{background:var(--c-brand-hover)}
.modal-err{
  margin-top:var(--s-2);padding:var(--s-2);background:var(--c-danger-soft);color:var(--c-danger);
  border-radius:var(--r-sm);font-size:var(--fz-sm);text-align:left;

}

/* === Lightbox === */

}

</head><body>

<div id="add-modal" class="modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">

<script>
var ca='',cu=0,ld=false,pt=null,cvCache={};
var wsr=null;
document.addEventListener('DOMContentLoaded',async function(){await la();uh();sy();wc()});
function wc(){if(!ca||wsr)return;wsr=new WebSocket('ws://'+location.host+'/ws?accountId='+ca);
wsr.onmessage=function(e){try{var d=JSON.parse(e.data);if(d.type=='new_message'||d.type=='old_message'){var m=d.data;var ml=document.getElementById('ml');var dv=renderMsg(m);if(d.type=='old_message' && ml.firstChild) ml.insertBefore(dv,ml.firstChild);else ml.appendChild(dv);ml.scrollTop=ml.scrollHeight}else if(d.type=='media_downloaded'){applyMediaDownloaded(d.data)}}catch(ex){}};
wsr.onclose=function(){wsr=null;setTimeout(wc,3000)}}
// accounts: cache list account cho tab Quan ly. Reload khi can.
var accounts=[];
// qrPollTimer: interval id cua QR poll loop.
var qrPollTimer=null;
// qrToken: token QR dang poll.
var qrToken='';

// loadAccounts lay danh sach account tu server (kem status listening/hasActiveSession).
async function loadAccounts(){try{var r=await fetch('/api/account/list');var d=await r.json();if(d.ok&&d.data){accounts=d.data;renderAccounts();renderStats();if(!ca&&accounts.length>0){ca=accounts[0].id;uh()}return true}return false}catch(e){return false}}

// renderAccounts ve lai danh sach account theo cache + filter search.
function renderAccounts(){
	var q=(document.getElementById('mg-search')||{value:''}).value.toLowerCase().trim();
	var ul=document.getElementById('ul');if(!ul) return;
	ul.innerHTML='';
	var filtered=accounts.filter(function(a){
		if(!q) return true;
		return(a.displayName||'').toLowerCase().indexOf(q)>=0||(a.id||'').toLowerCase().indexOf(q)>=0;
	});
	if(!filtered.length){
		ul.innerHTML='<div class="mg-empty">'
			+(accounts.length?'<div class="mg-empty-i">🔍</div><div>Không có tài khoản khớp "'+esc(q)+'"</div>':'<div class="mg-empty-i">👤</div><div>Chưa có tài khoản nào</div><div class="mg-empty-sub">Bấm <b>+ Thêm</b> để đăng nhập QR hoặc Cookie.</div>')
			+'</div>';
		return;
	}
	filtered.forEach(function(a){
		var dv=document.createElement('div');dv.className='mg-item';
		if(a.id===ca) dv.className+=' cur';
		var stClass=a.listening?'on':(a.hasActiveSession?'err':'off');
		var stTitle=a.listening?'Dang nghe WS':(a.hasActiveSession?'Session OK, listener chua chay':'Khong co session active');
		var uId=esc(a.id);
		dv.innerHTML='<div class="mg-av"><img src="'+(a.avatar||'')+'" onerror="this.style.display=\'none\'" alt=""></div>'
			+'<div class="mg-body">'
			// row 1: ten account + status dot
			+'<div class="mg-row1">'
			+'<span class="mg-st '+stClass+'" title="'+stTitle+'"></span>'
			+'<span class="mg-n">'+(a.displayName||a.id)+'</span>'
			+'</div>'
			// row 2: acc id (mono, nho)
			+'<div class="mg-row2">'
			+'<span class="mg-meta">'+esc(a.id)+'</span>'
			+'</div>'
			// row 3: badge "Dang dung" + nut Restart + nut Xoa
			+'<div class="mg-row3">'
			+(a.id===ca?'<span class="mg-cur">Đang dùng</span>':'')
			+'<button class="mg-btn" onclick="restartListener(\''+uId+'\')">Restart</button>'
			+'<button class="mg-del" onclick="xd(\''+uId+'\')">Xoá</button>'
			+'</div>'
			+'</div>';
		ul.appendChild(dv);
	});
}

// renderStats hien thi summary (tong so, dang nghe, offline).
function renderStats(){
	var s=document.getElementById('mg-stats');if(!s)return;
	var total=accounts.length;
	var on=accounts.filter(function(a){return a.listening}).length;
	var sess=accounts.filter(function(a){return a.hasActiveSession}).length;
	s.textContent=total+' tài khoản • '+on+' đang nghe WS • '+sess+' có session';
}

// switchAcc chuyen sang account (khong F5).
function switchAcc(id){
	// Dong WS cu neu dang mo de wc() reconnect cho account moi.
	if(wsr){try{wsr.onclose=null;wsr.close()}catch(e){}wsr=null;}
	ca=id;uh();sy();st('ch');
}

// restartListener stop+start listener (fix khi WS bi loi, session con song).
async function restartListener(id){
	try{
		await fetch('/api/account/restart?accountId='+encodeURIComponent(id),{method:'POST'});
		setTimeout(loadAccounts,500);
	}catch(e){console.log('restart err',e)}
}

// Hien thi modal them tai khoan.
async function showAddModal(){
	var m=document.getElementById('add-modal');if(!m)return;
	m.style.display='flex';
	switchAddTab('qr');
	await createQR();
}
// An modal.
function hideAddModal(){
	var m=document.getElementById('add-modal');if(!m)return;
	m.style.display='none';
	stopQRPoll();
}
// Chuyen tab QR/Cookie trong modal.
function switchAddTab(t){
	document.querySelectorAll('.modal-tab').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t)});
	document.getElementById('qr-pane').style.display=t==='qr'?'':'none';
	document.getElementById('cookie-pane').style.display=t==='cookie'?'':'none';
	if(t==='qr') createQR();
	else stopQRPoll();
}
// Tao QR moi + bat dau polling.
async function createQR(){
	document.getElementById('qr-loading').style.display='';
	document.getElementById('qr-img').style.display='none';
	document.getElementById('qr-expire').style.display='none';
	document.getElementById('qr-err').style.display='none';
	try{
		var r=await fetch('/api/qr/create');var d=await r.json();
		if(!d.ok||!d.data){throw new Error(d.error||'tao QR that bai')}
		qrToken=d.data.token;
		document.getElementById('qr-img').src=d.data.image;
		document.getElementById('qr-img').style.display='';
		document.getElementById('qr-loading').style.display='none';
		// Poll sau 1.5s
		setTimeout(pollQR,1500);
	}catch(e){
		document.getElementById('qr-loading').style.display='none';
		var er=document.getElementById('qr-err');
		er.innerHTML='<div>'+esc(e.message||String(e))+'</div>'
			+'<button class="modal-primary" style="margin-top:var(--s-2)" onclick="createQR()">↻ Tạo lại QR</button>';
		er.style.display='';
	}
}
// Poll QR. Khi thanh cong -> reload page.
async function pollQR(){
	if(!qrToken)return;
	try{
		var r=await fetch('/api/qr/poll?token='+encodeURIComponent(qrToken));var d=await r.json();
		if(d.ok&&d.data&&d.data.pending){
			setTimeout(pollQR,1500);return;
		}
		if(d.ok&&d.data&&d.data.accountId){
			// Login thanh cong!
			stopQRPoll();hideAddModal();window.location.reload();return;
		}
		// Loi: hien thi + cho nut tao lai
		if(!d.ok){
			var ex=document.getElementById('qr-expire');
			ex.innerHTML='<div>'+esc(d.error||'QR hết hạn hoặc bị lỗi')+'</div>'
				+'<button class="modal-primary" style="margin-top:var(--s-2)" onclick="createQR()">↻ Tạo lại QR</button>';
			ex.style.display='';
			stopQRPoll();
			return;
		}
	}catch(e){console.log('poll err',e)}
	setTimeout(pollQR,1500);
}
function stopQRPoll(){if(qrPollTimer){clearTimeout(qrPollTimer);qrPollTimer=null}qrToken=''}

// Submit cookie login.
async function submitCookie(){
	var ta=document.getElementById('cookie-input');
	var er=document.getElementById('cookie-err');
	er.style.display='none';
	if(!ta.value.trim()){er.textContent='Chua nhap cookie';er.style.display='';return}
	try{
		var r=await fetch('/api/login/cookie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookies:ta.value})});
		var d=await r.json();
		if(d.ok){
			hideAddModal();window.location.reload();
		}else{
			er.textContent=d.error||'Login that bai';er.style.display='';
		}
	}catch(e){er.textContent=String(e);er.style.display=''}
}

// Backward compat: la() goi loadAccounts de giu signature cu.
async function la(){return loadAccounts()}
function uh(){if(!ca)return;fetch('/api/account?accountId='+ca).then(function(r){return r.json()}).then(function(d){if(d.ok&&d.data){var img=document.getElementById('himg');if(d.data.avatar){img.src=d.data.avatar;img.style.display=''}else{img.style.display='none'}document.getElementById('hdn').textContent=d.data.displayName||''}}).catch(function(){})}
function st(t){document.querySelectorAll('.sp').forEach(function(e){e.classList.remove('on')});document.querySelectorAll('.sb-btn').forEach(function(b){b.classList.remove('on')});document.getElementById('pn-'+t).classList.add('on');document.querySelector('.sb-btn[onclick*="'+t+'"]').classList.add('on');if(t=='co'&&ca)loadFriends();if(t=='mg'){la()}}
function el(i,h){var e=document.getElementById(i);if(h!==undefined)e.innerHTML=h;return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
// renderAck trả về badge cho delivery ack (tin server chỉ xác nhận gửi/nhận/xem).
// status: "sent" (mặc định — server đã nhận), "delivered", "seen", "unsent".
// ackId: globalDelMsgId từ Zalo (nếu có) để debug.
function renderAck(m){
  var st=m.ackStatus||'sent';
  var labels={sent:'Đã gửi',delivered:'Đã nhận',seen:'Đã xem',unsent:'Thu hồi'};
  var ic={sent:'✓',delivered:'✓✓',seen:'✓✓',unsent:'⟲'};
  var lb=labels[st]||('Đã gửi'+(st?(' ('+st+')'):' (chưa rõ)'));
  var icn=ic[st]||'✓';
  var dv=document.createElement('div');
  dv.className='msg ack '+st;
  dv.dataset.msg=m.id;
  var t=new Date(m.timestamp);
  var ts=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  var hint='';
  if(st==='sent'&&(!m.ackStatus||!m.ackId)) hint=' — chưa rõ trạng thái';
  var idPart=m.ackId?' <span class="ack-id">#'+esc(m.ackId)+'</span>':'';
  dv.innerHTML='<span class="ack-ic">'+icn+'</span><span class="ack-tx">'+esc(lb)+esc(hint)+'</span>'+idPart+'<div class="tm">'+ts+'</div>';
  return dv;
}

function renderMsg(m){
  // Nếu server đánh dấu đây là delivery ack → render badge thay vì text thô.
  if(m.isAck||(m.content&&m.content.charAt(0)==='['&&m.content.indexOf('actionType')>=0)){
    return renderAck(m);
  }
  var dv=document.createElement('div');dv.className='msg '+(m.fromId===ca?'out':'in');dv.dataset.msg=m.id;
  var t=new Date(m.timestamp);
  var ts=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  var fn=(m.fromName&&m.fromId!==ca)?m.fromName:(cvCache[m.fromId]?cvCache[m.fromId].name:'');
  var body='';
  body+=renderAttachments(m.attachments||[],m.id,m.convId||cc);
  body+=esc(m.content||'');
  dv.innerHTML=(fn?'<div class="nm">'+esc(fn)+'</div>':'')+body+'<div class="tm">'+ts+'</div>';
  return dv;
}

// imageExt: đuôi ảnh browser hiểu được. Trả về ext nếu là ảnh, '' nếu không.
function imageExt(nameOrUrl){
  var ext=(nameOrUrl||'').split('.').pop().toLowerCase().split('?')[0].split('#')[0];
  if(['jpg','jpeg','png','gif','webp','bmp'].indexOf(ext)>=0) return ext;
  return '';
}
function videoExt(nameOrUrl){
  var ext=(nameOrUrl||'').split('.').pop().toLowerCase().split('?')[0].split('#')[0];
  if(['mp4','webm','mov','m4v'].indexOf(ext)>=0) return ext;
  return '';
}
// localMediaUrl: nếu url đã trỏ về /media/ thì dùng luôn, không tải lại.
function localMediaUrl(url){
  if(!url) return '';
  if(url.charAt(0)==='/'&&url.indexOf('/media/')===0) return url;
  return '';
}
// renderAttachments: trả HTML cho mọi attachment của 1 message.
// Ảnh: <img> grid (1 ảnh max 320px, 2-3 ảnh 2 cột vuông, 4+ ảnh 3 cột).
//       URL Zalo CDN → auto POST /api/media/download để proxy về /media/.
// Video: <video controls>. File khác: <a> tải về.
function renderAttachments(atts,msgId,convId){
  if(!atts||!atts.length) return '';
  var imgs=[],vids=[],files=[];
  for(var i=0;i<atts.length;i++){
    var a=atts[i];if(!a||!a.url) continue;
    var id=a.id||'';
    // Bỏ variant kích thước: -hdUrl/-oriUrl/-thumbUrl/-thumb/-normalUrl.
    if(/-(hdUrl|oriUrl|thumbUrl|thumb|normalUrl)$/.test(id)) continue;
    var ie=imageExt(a.fileName||a.url);
    var ve=videoExt(a.fileName||a.url);
    if(ie){imgs.push({url:a.url,fileName:a.fileName,id:imgBaseId(id),ie:ie})}
    else if(ve){vids.push({url:a.url,fileName:a.fileName,id:vidBaseId(id),ve:ve})}
    else{files.push({url:a.url,fileName:a.fileName,fileSize:a.fileSize,id:id})}
  }
  var html='';
  if(imgs.length){html+=renderImageGrid(imgs,msgId,convId)}
  for(var j=0;j<vids.length;j++){
    var v=vids[j];
    var vSrc=localMediaUrl(v.url)||v.url;
    html+='<video class="media" controls preload="metadata" src="'+esc(vSrc)+'"></video>';
  }
  for(var k=0;k<files.length;k++){
    var f=files[k];
    var fSrc=localMediaUrl(f.url)||f.url;
    var label=f.fileName||'Tải file';
    if(f.fileSize){label+=' ('+humanSize(f.fileSize)+')'}
    html+='<a class="file" href="'+esc(fSrc)+'" target="_blank" rel="noopener">'+esc(label)+'</a>';
  }
  return html;
}
function imgBaseId(id){var i=id.lastIndexOf('-');return i>0?id.substring(0,i):id;}
function vidBaseId(id){var i=id.lastIndexOf('-');return i>0?id.substring(0,i):id;}
function humanSize(n){
  if(!n||n<1024) return n+'B';
  if(n<1024*1024) return Math.round(n/1024)+'KB';
  if(n<1024*1024*1024) return Math.round(n/1024/1024)+'MB';
  return (n/1024/1024/1024).toFixed(1)+'GB';
}
// renderImageGrid: render 1-n ảnh theo layout responsive.
function renderImageGrid(imgs,msgId,convId){
  var cls='imgs imgs-'+(imgs.length<=1?'1':imgs.length<=3?'2-3':'4p');
  var html='<div class="'+cls+'">';
  for(var i=0;i<imgs.length;i++){
    var a=imgs[i];
    var local=localMediaUrl(a.url);
    var src=local||a.url;
    var dn=local?'':' data-zalo="1" data-fname="'+esc(a.fileName||'')+'" data-ext="'+esc(a.ie)+'"';
    html+='<img class="img" loading="lazy" src="'+esc(src)+'" alt="'+esc(a.fileName||'')+'"'+dn;
    html+=' onclick="openLightbox(this)" onerror="imgErr(this)" data-mid="'+esc(msgId)+'" data-cid="'+esc(convId)+'">';
  }
  html+='</div>';
  return html;
}
// imgErr: ảnh Zalo CDN load fail → tự download về server rồi swap src sang /media/.
function imgErr(img){
  if(img.dataset.zalo!=='1'){img.style.display='none';return}
  img.dataset.zalo='2';
  var mid=img.dataset.mid,cid=img.dataset.cid,fname=img.dataset.fname||'',ext=img.dataset.ext||'jpg';
  var url=img.getAttribute('src');
  var ph=document.createElement('div');ph.className='img-spinner';ph.textContent='Đang tải...';
  img.parentNode.insertBefore(ph,img);img.style.display='none';
  fetch('/api/media/download',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({accountId:ca,convId:cid,url:url,fileName:fname,fileExt:ext,msgId:mid})
  }).then(function(r){return r.json()}).then(function(d){
    if(d.ok&&d.data&&d.data.url){
      var local=d.data.url;
      var sels='.img[data-mid="'+cssEsc(mid)+'"][data-cid="'+cssEsc(cid)+'"][src="'+cssEsc(url)+'"]';
      document.querySelectorAll(sels).forEach(function(el){
        el.src=local;el.dataset.zalo='';el.style.display='';
      });
      if(ph&&ph.parentNode) ph.parentNode.removeChild(ph);
    }else{
      ph.textContent='Lỗi tải ảnh';ph.className='img-err';
    }
  }).catch(function(){
    ph.textContent='Lỗi tải ảnh';ph.className='img-err';
  });
}
function cssEsc(s){return String(s||'').replace(/["\\]/g,'\\$&')}
// openLightbox: phóng to ảnh khi click. Esc/click backdrop đóng.
var lbEl=null;
function openLightbox(img){
  if(!lbEl){
    lbEl=document.createElement('div');lbEl.className='lb';
    lbEl.innerHTML='<div class="lb-bg" onclick="closeLightbox()"></div><img class="lb-img" alt=""><div class="lb-cap"></div>';
    document.body.appendChild(lbEl);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox()});
  }
  lbEl.querySelector('.lb-img').src=img.src;
  lbEl.querySelector('.lb-cap').textContent=img.alt||'';
  lbEl.classList.add('on');
}
function closeLightbox(){if(lbEl) lbEl.classList.remove('on')}
// applyMediaDownloaded: server báo đã tải xong media của 1 message. Swap src.
function applyMediaDownloaded(data){
  if(!data||!data.msgId) return;
  var local=data.url;
  document.querySelectorAll('#ml .msg[data-msg="'+cssEsc(data.msgId)+'"] .img[data-zalo]').forEach(function(el){
    if(local){el.src=local;el.dataset.zalo=''}
  });
}

async function loadFriends(){if(!ca){el('fl','<div style="padding:20px;text-align:center;color:#999">Chưa chọn user</div>');return}
el('fl','<div style="padding:20px;text-align:center;color:#999">Đang tải...</div>');

if(d.ok&&d.data&&d.data.length>0){el('fl','');
d.data.forEach(function(u){var dv=document.createElement('div');dv.className='cv';dv.dataset.id=u.id;
dv.innerHTML='<div class="cv-a"><img src="'+(u.avatar||'')+'" onerror="this.style.display=\'none\'"></div><div class="cv-b"><div class="cv-n">'+(u.name||u.id)+'</div></div>';
dv.onclick=function(){sc(u.id,u.name,u.avatar)};el('fl').appendChild(dv)})}
else{el('fl','<div style="padding:20px;text-align:center;color:#999">'+((d.error)||'Không có bạn bè')+'</div>')}}
catch(e){el('fl','<div style="padding:20px;text-align:center;color:#999">Lỗi tải bạn bè</div>')}}
async function sy(){if(!ca)return;
try{var r=await fetch('/api/conversations/sync?accountId='+ca);var d=await r.json();
if(d.ok&&d.data){el('cl','');
d.data.forEach(function(c){cvCache[c.id]={name:c.name,avatar:c.avatar};
var dv=document.createElement('div');dv.className='cv';dv.dataset.id=c.id;
dv.innerHTML='<div class="cv-a"><img src="'+(c.avatar||'')+'" onerror="this.style.display=\'none\'"></div><div class="cv-b"><div class="cv-n">'+(c.name||c.id)+'</div><div class="cv-p">'+(c.lastMsgId||'')+'</div></div>';
dv.onclick=function(){sc(c.id,c.name,c.avatar)};el('cl').appendChild(dv)});}}catch(e){}}
function sc(id,nm,av){cc=id;cvCache[id]={name:nm,avatar:av};cu=0;cuEnd=false;
document.querySelectorAll('.cv').forEach(function(c){c.classList.toggle('on',c.dataset.id===id)});
document.getElementById('ctt').textContent=nm||id;document.getElementById('ia').classList.remove('hd');
el('ml','<div class="lm" id="lm-btn" onclick="lm(true)">Tải tin nhắn cũ</div>');
fetch('/api/messages/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accountId:ca,convId:id})}).then(function(r){if(!r.ok)console.log('sync unavailable')}).catch(function(){});lm()}
// lm(manual) — load thêm tin cũ. manual=true khi user click button.
// Khi cuộn lên đầu thread (scrollTop <= 80px) sẽ tự gọi.
// Giữ vị trí scroll: trước khi append lưu scrollHeight, sau khi append
// bù lại phần chênh lệch để tin đang đọc không bị giật.
async function lm(manual){
  if(!cc||ld||!ca||cuEnd)return;
  ld=true;
  var ml=document.getElementById('ml');
  var btn=document.getElementById('lm-btn');
  var load=document.getElementById('lm-load');
  if(manual){
    // click thủ công: không cần preserve scroll (user đang ở đầu rồi).
    if(btn){btn.className='lm-load';btn.textContent='Đang tải...';btn.onclick=null;}
  }else{
    // auto-scroll trigger: chèn spinner tạm ở đầu để tránh nhảy layout.
    if(!load){load=document.createElement('div');load.id='lm-load';load.className='lm-load';load.textContent='Đang tải...';ml.insertBefore(load,ml.firstChild);}
  }
  try{
    var r=await fetch('/api/messages?accountId='+ca+'&convId='+cc+'&cursor='+cu+'&limit=30');
    var d=await r.json();
    if(d.ok&&d.data&&d.data.length>0){
      var oldH=ml.scrollHeight,oldT=ml.scrollTop;
      if(cu===0){el('ml','');ml=document.getElementById('ml');}
      // Chèn tin cũ vào đầu, giữ nguyên các node hiện tại.
      var frag=document.createDocumentFragment();
      d.data.forEach(function(m){frag.appendChild(renderMsg(m))});
      // Sau khi xóa spinner (nếu có), chèn fragment lên đầu.
      var sp=document.getElementById('lm-load');if(sp)sp.remove();
      ml.insertBefore(frag,ml.firstChild);
      // Bù scroll để giữ vị trí.
      var newH=ml.scrollHeight;
      if(cu===0){
        // First load: cuộn xuống cuối.
        ml.scrollTop=ml.scrollHeight;
      }else{
        ml.scrollTop=oldT+(newH-oldH);
      }
      cu=d.data[d.data.length-1].timestamp;
      // Nếu batch đầy → vẫn còn tin cũ hơn → giữ button.
      // Nếu batch < limit → hết → đổi sang thông báo end.
      if(d.data.length<30){
        cuEnd=true;
        if(btn){btn.remove();}
        var end=document.createElement('div');end.className='lm-end';end.textContent='Đã tải hết lịch sử';
        ml.insertBefore(end,ml.firstChild);
      }else if(btn){
        btn.className='lm';btn.textContent='Tải tin nhắn cũ';btn.onclick=function(){lm(true);};
      }
    }else{
      cuEnd=true;
      var sp=document.getElementById('lm-load');if(sp)sp.remove();
      if(btn){btn.remove();}
      var end=document.createElement('div');end.className='lm-end';end.textContent='Đã tải hết lịch sử';
      ml.insertBefore(end,ml.firstChild);
    }
  }catch(e){
    var sp=document.getElementById('lm-load');if(sp)sp.remove();
    if(btn){btn.className='lm';btn.textContent='Tải tin nhắn cũ (thử lại)';btn.onclick=function(){lm(true);};}
  }finally{ld=false;}
}
// Auto-load khi cuộn lên đầu thread.
document.addEventListener('DOMContentLoaded',function(){
  var ml=document.getElementById('ml');
  ml.addEventListener('scroll',function(){
    if(ml.scrollTop<=80&&!ld&&!cuEnd&&cc){lm(false);}
  });
});

function rd(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase()}

function ff(q){var qr=rd(q);document.querySelectorAll('#pn-co .cv').forEach(function(c){c.style.display=rd(c.textContent).indexOf(qr)!==-1?'':'none'})}
