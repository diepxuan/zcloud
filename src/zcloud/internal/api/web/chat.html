<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ZCloud Chat</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f5f5f5;height:100vh;display:flex;flex-direction:column}
.hdr{background:#0068ff;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
.hdr h1{font-size:18px;flex:1}
.hdr button{background:rgba(255,255,255,.2);color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer}
.ct{display:flex;flex:1;overflow:hidden}
.sb{width:60px;background:#fff;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;align-items:center;padding:8px 0;flex-shrink:0}
.sb-btn{width:40px;height:40px;border:none;background:none;cursor:pointer;border-radius:8px;font-size:20px;color:#666;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.sb-btn.on{background:#0068ff;color:#fff}
.sb-btn:hover{background:#e8f0ff}
.sb-bot{margin-top:auto}
.sb-div{width:32px;height:1px;background:#e0e0e0;margin:8px 0}
.sp{flex:0 0 280px;display:none;flex-direction:column;overflow-y:auto;background:#fff;border-right:1px solid #e0e0e0}
.sp.on{display:flex}
.sr{padding:12px 16px;border-bottom:1px solid #e0e0e0}
.sr input{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.cv{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.cv:hover{background:#f5f8ff}.cv.on{background:#e8f0ff}
.cv-a{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#e0e0e0}
.cv-a img{width:100%;height:100%;object-fit:cover}
.cv-b{flex:1;min-width:0}
.cv-n{font-size:14px;font-weight:500;color:#333}
.cv-p{font-size:12px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca{flex:1;display:flex;flex-direction:column}
.ch{padding:12px 16px;background:#fff;border-bottom:1px solid #e0e0e0}
.ch h2{font-size:16px;color:#333}
.ms{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:70%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.4}
.msg.in{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.msg.out{background:#0068ff;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg .tm{font-size:10px;opacity:.6;margin-top:4px;text-align:right}
.msg.out .tm{color:rgba(255,255,255,.7)}
.msg .nm{font-size:11px;color:#0068ff;font-weight:500;margin-bottom:2px}
/* Ảnh đính kèm: grid responsive. 1 ảnh max 320px, 2-3 ảnh 2 cột vuông, 4+ ảnh 3 cột. */
.msg .imgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.msg .imgs .img{width:160px;height:160px;object-fit:cover;border-radius:8px;cursor:pointer;background:#e8e8e8;display:block;transition:transform .15s}
.msg .imgs .img:hover{transform:scale(1.02)}
.msg .imgs.imgs-1 .img{width:auto;height:auto;max-width:320px;max-height:320px;border-radius:8px}
.msg .imgs.imgs-2-3 .img{width:calc(50% - 2px);height:160px}
.msg .imgs.imgs-4p .img{width:calc(33.333% - 3px);height:120px}
.msg .imgs .img-spinner,.msg .imgs .img-err{width:160px;height:160px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.05);border-radius:8px;color:#666;font-size:12px;text-align:center;padding:8px}
.msg video.media{max-width:320px;max-height:320px;border-radius:8px;display:block;margin-top:4px}
.msg a.file{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:6px 10px;background:rgba(0,104,255,.08);color:#0068ff;border-radius:6px;font-weight:500;font-size:13px;text-decoration:none}
.msg.out a.file{background:rgba(255,255,255,.18);color:#fff}
/* Lightbox phóng to ảnh khi click */
.lb{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb-bg{position:absolute;inset:0;background:rgba(0,0,0,.85)}
.lb-img{position:relative;max-width:95vw;max-height:90vh;object-fit:contain;border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.lb-cap{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:12px;max-width:80vw;text-align:center}
/* Delivery ack badge — tin nhắn chỉ là ack gửi/nhận, không phải text. */
.msg.ack{max-width:60%;padding:6px 12px;font-size:12px;opacity:.85;align-self:center;border-radius:14px;background:transparent;border:1px dashed rgba(0,0,0,.15);color:#666;text-align:center;line-height:1.3}
.msg.ack .ack-ic{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.msg.ack .ack-tx{font-weight:500}
.msg.ack.sent{color:#888}.msg.ack.delivered{color:#2e7d32}.msg.ack.seen{color:#1565c0}.msg.ack.unsent{color:#c62828}
.msg.ack .ack-id{font-size:10px;opacity:.5;margin-left:4px;font-family:monospace}
.ia{display:flex;padding:12px 16px;background:#fff;border-top:1px solid #e0e0e0;gap:8px}
.ia input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:20px;font-size:14px;outline:none}
.ia input:focus{border-color:#0068ff}
.ia button{padding:10px 20px;background:#0068ff;color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer}
.em{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#999;gap:8px;font-size:48px}
.lm{text-align:center;padding:8px;color:#0068ff;cursor:pointer;font-size:13px}
.lm-end{text-align:center;padding:8px;color:#999;font-size:12px;opacity:.6}
.lm-load{text-align:center;padding:6px;color:#0068ff;font-size:12px;opacity:.8}
.lm-load::before{content:'';display:inline-block;width:10px;height:10px;border:2px solid #0068ff;border-right-color:transparent;border-radius:50%;animation:lm-spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes lm-spin{to{transform:rotate(360deg)}}
.hd{display:none}
.mg{padding:0}
.mg-h{background:#f5f5f5;padding:10px 16px;border-bottom:1px solid #e0e0e0;font-size:13px;font-weight:600;color:#333;text-transform:uppercase;letter-spacing:.5px}
.mg-item{display:grid;grid-template-columns:36px 1fr;gap:8px 10px;padding:10px 16px;border-bottom:1px solid #f0f0f0;align-items:center}
.mg-item:last-child{border-bottom:none}
.mg-item:hover{background:#f5f8ff}
.mg-item .mg-av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#e0e0e0;grid-row:1/3;align-self:center}
.mg-item .mg-av img{width:100%;height:100%;object-fit:cover}
.mg-item .mg-n{font-size:13px;color:#333;font-weight:500;grid-column:2;grid-row:1;text-align:left}
.mg-item .mg-acts{grid-column:2;grid-row:2;text-align:right;display:flex;gap:8px;justify-content:flex-end}
.mg-item .mg-btn{background:transparent;color:#0068ff;border:1px solid #0068ff;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.mg-item .mg-btn:hover{background:#0068ff;color:#fff}
.mg-item .mg-del{background:transparent;color:#ff4444;border:1px solid #ff4444;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.mg-item .mg-del:hover{background:#ff4444;color:#fff}
.mg-toolbar{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid #f0f0f0;background:#fff;position:sticky;top:0;z-index:1}
.mg-toolbar input{flex:1;padding:6px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px;outline:none}
.mg-toolbar input:focus{border-color:#0068ff}
.mg-toolbar button{background:#0068ff;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500}
.mg-toolbar button:hover{background:#0052cc}
.mg-stats{padding:6px 16px;background:#f5f5f5;font-size:11px;color:#666;border-bottom:1px solid #f0f0f0}
.mg-item .mg-st{width:8px;height:8px;border-radius:50%;flex-shrink:0;align-self:center}
.mg-item .mg-st.on{background:#4caf50;box-shadow:0 0 4px rgba(76,175,80,.5)}
.mg-item .mg-st.off{background:#ccc}
.mg-item .mg-st.err{background:#ff9800}
.mg-item .mg-grid{display:flex;align-items:center;gap:10px;grid-column:1/3;grid-row:1}
.mg-item .mg-meta{font-size:11px;color:#999;grid-column:2;grid-row:2;text-align:left;margin-top:-4px}
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.modal-card{position:relative;background:#fff;border-radius:8px;width:380px;max-width:90vw;max-height:90vh;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #e0e0e0;font-size:15px;font-weight:500}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#666;padding:0;width:28px;height:28px;line-height:1}
.modal-close:hover{color:#333}
.modal-tabs{display:flex;border-bottom:1px solid #e0e0e0}
.modal-tab{flex:1;background:none;border:none;padding:12px;cursor:pointer;font-size:13px;color:#666;border-bottom:2px solid transparent}
.modal-tab.on{color:#0068ff;border-bottom-color:#0068ff;font-weight:500}
.modal-tab:hover{background:#f5f5f5}
.modal-body{padding:18px;text-align:center}
.modal-body textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-family:monospace;font-size:12px;resize:vertical;box-sizing:border-box}
.qr-loading{padding:40px;color:#999;font-size:13px}
#qr-img{display:block;margin:0 auto;max-width:240px;height:auto;border:1px solid #e0e0e0;border-radius:4px;padding:8px;background:#fff}
.qr-expire{padding:20px;color:#c62828;font-size:13px}
.qr-hint{margin-top:14px;font-size:12px;color:#666;line-height:1.5}
.modal-primary{margin-top:12px;background:#0068ff;color:#fff;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;font-size:13px;width:100%}
.modal-primary:hover{background:#0052cc}
.modal-err{margin-top:10px;padding:8px;background:#ffebee;color:#c62828;border-radius:4px;font-size:12px;text-align:left}
@media(max-width:768px){.sb{width:100%}.sb.hide{display:none}}
</style>
</head><body>
<div class="hdr"><div class="ha" id="ha" style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);overflow:hidden;flex-shrink:0"><img id="himg" src="" onerror="this.style.display='none'" style="width:100%;height:100%;object-fit:cover"></div><h1 id="hdn" style="font-size:16px;flex:1">ZCloud</h1><a href="/chat" style="flex-shrink:0"><img src="/favicon.svg" width="28" height="28" style="display:block"></a></div>
<div class="ct">
<div class="sb">
<button class="sb-btn on" onclick="st('ch')" title="Trò chuyện">💬</button>
<button class="sb-btn" onclick="st('co')" title="Liên hệ">👥</button>
<div class="sb-bot"></div>
<div class="sb-div"></div>
<button class="sb-btn" onclick="st('mg')" title="Quản lý">⚙️</button>
</div>
<div id="pn-ch" class="sp on">
<div class="sr"><input type="text" placeholder="Tìm kiếm..." oninput="fc(this.value)"></div>
<div id="cl"></div>
</div>
<div id="pn-co" class="sp">
<div class="sr"><input type="text" placeholder="Tìm bạn..." oninput="ff(this.value)"></div>
<div id="fl"></div>
</div>
	<div id="pn-mg" class="sp">
	<div class="mg">
	<div class="mg-h">Quản lý tài khoản</div>
	<div class="mg-toolbar">
	<input id="mg-search" type="text" placeholder="Tìm theo tên hoặc ID..." oninput="renderAccounts()">
	<button id="mg-add" onclick="showAddModal()">+ Thêm tài khoản</button>
	</div>
	<div class="mg-stats" id="mg-stats"></div>
	<div id="ul"></div>
	</div>
	</div>
<!-- Modal thêm tài khoản (QR + Cookie) -->
<div id="add-modal" class="modal" style="display:none">
<div class="modal-bg" onclick="hideAddModal()"></div>
<div class="modal-card">
<div class="modal-h"><span>Thêm tài khoản Zalo</span><button class="modal-close" onclick="hideAddModal()">×</button></div>
<div class="modal-tabs">
<button class="modal-tab on" data-tab="qr" onclick="switchAddTab('qr')">Quét QR</button>
<button class="modal-tab" data-tab="cookie" onclick="switchAddTab('cookie')">Cookie</button>
</div>
<div class="modal-body" id="qr-pane">
<div id="qr-loading" class="qr-loading">Đang tạo mã QR...</div>
<img id="qr-img" style="display:none" alt="QR Zalo">
<div id="qr-expire" class="qr-expire" style="display:none">Mã QR hết hạn. Vui lòng tạo mới.</div>
<div class="qr-hint">Mở Zalo điện thoại → Cài đặt → Máy tính và tablet → Quét mã QR</div>
</div>
<div class="modal-body" id="cookie-pane" style="display:none">
<textarea id="cookie-input" placeholder="Danh sách cookie từ Zalo PC (zpsid, zpw_sek...)" rows="6"></textarea>
<div class="qr-hint">Lấy cookie từ Zalo PC bằng DevTools. Mỗi lần chỉ thêm được 1 account.</div>
<button class="modal-primary" onclick="submitCookie()">Đăng nhập bằng Cookie</button>
<div id="cookie-err" class="modal-err" style="display:none"></div>
</div>
<div id="qr-err" class="modal-err" style="display:none"></div>
</div>
</div>
<div class="ca">
<div class="ch"><h2 id="ctt">Chọn hội thoại</h2></div>
<div class="ms" id="ml"><div class="em">Chọn một hội thoại để bắt đầu</div></div>
<div class="ia hd" id="ia"><input type="text" id="mi" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter')sm()"><button onclick="sm()">Gửi</button></div>
</div>
</div>
<script>
var ca='',cu=0,ld=false,pt=null,cvCache={};
var wsr=null;
document.addEventListener('DOMContentLoaded',async function(){await la();uh();sy();wc()});
function wc(){if(!ca||wsr)return;wsr=new WebSocket('ws://'+location.host+'/ws?accountId='+ca);
wsr.onmessage=function(e){try{var d=JSON.parse(e.data);if(d.type=='new_message'||d.type=='old_message'){var m=d.data;var ml=document.getElementById('ml');var dv=renderMsg(m);if(d.type=='old_message' && ml.firstChild) ml.insertBefore(dv,ml.firstChild);else ml.appendChild(dv);ml.scrollTop=ml.scrollHeight}else if(d.type=='media_downloaded'){applyMediaDownloaded(d.data)}}catch(ex){}};
wsr.onclose=function(){wsr=null;setTimeout(wc,3000)}}
// accounts: cache list account cho tab Quan ly. Reload khi can.
var accounts=[];
// qrPollTimer: interval id cua QR poll loop.
var qrPollTimer=null;
// qrToken: token QR dang poll.
var qrToken='';

// loadAccounts lay danh sach account tu server (kem status listening/hasActiveSession).
async function loadAccounts(){try{var r=await fetch('/api/account/list');var d=await r.json();if(d.ok&&d.data){accounts=d.data;renderAccounts();renderStats();if(!ca&&accounts.length>0){ca=accounts[0].id;uh()}return true}return false}catch(e){return false}}

// renderAccounts ve lai danh sach account theo cache + filter search.
function renderAccounts(){
	var q=(document.getElementById('mg-search')||{value:''}).value.toLowerCase().trim();
	var ul=document.getElementById('ul');if(!ul) return;
	ul.innerHTML='';
	var filtered=accounts.filter(function(a){
		if(!q) return true;
		return(a.displayName||'').toLowerCase().indexOf(q)>=0||(a.id||'').toLowerCase().indexOf(q)>=0;
	});
	filtered.forEach(function(a){
		var dv=document.createElement('div');dv.className='mg-item';
		var stClass=a.listening?'on':(a.hasActiveSession?'err':'off');
		var stTitle=a.listening?'Dang nghe WS':(a.hasActiveSession?'Session OK, listener chua chay':'Khong co session active');
		var uId=esc(a.id);
		dv.innerHTML='<div class="mg-grid">'
			+'<div class="mg-av"><img src="'+(a.avatar||'')+'" onerror="this.style.display=\'none\'"></div>'
			+'<div style="flex:1;min-width:0"><div class="mg-n">'+(a.displayName||a.id)+'</div>'
			+'<div class="mg-meta"><span class="mg-st '+stClass+'" title="'+stTitle+'"></span> '+esc(a.id)+'</div>'
			+'</div></div>'
			+'<div class="mg-acts">'
			+'<button class="mg-btn" onclick="switchAcc(\''+uId+'\')">Chuyển</button> '
			+'<button class="mg-btn" onclick="restartListener(\''+uId+'\')">Restart</button> '
			+'<button class="mg-del" onclick="xd(\''+uId+'\')">Xoá</button>'
			+'</div>';
		ul.appendChild(dv);
	});
}

// renderStats hien thi summary (tong so, dang nghe, offline).
function renderStats(){
	var s=document.getElementById('mg-stats');if(!s)return;
	var total=accounts.length;
	var on=accounts.filter(function(a){return a.listening}).length;
	var sess=accounts.filter(function(a){return a.hasActiveSession}).length;
	s.textContent=total+' tài khoản • '+on+' đang nghe WS • '+sess+' có session';
}

// switchAcc chuyen sang account (khong F5).
function switchAcc(id){
	ca=id;uh();sy();st('ch');
}

// restartListener stop+start listener (fix khi WS bi loi, session con song).
async function restartListener(id){
	try{
		await fetch('/api/account/restart?accountId='+encodeURIComponent(id),{method:'POST'});
		setTimeout(loadAccounts,500);
	}catch(e){console.log('restart err',e)}
}

// Hien thi modal them tai khoan.
async function showAddModal(){
	var m=document.getElementById('add-modal');if(!m)return;
	m.style.display='flex';
	switchAddTab('qr');
	await createQR();
}
// An modal.
function hideAddModal(){
	var m=document.getElementById('add-modal');if(!m)return;
	m.style.display='none';
	stopQRPoll();
}
// Chuyen tab QR/Cookie trong modal.
function switchAddTab(t){
	document.querySelectorAll('.modal-tab').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t)});
	document.getElementById('qr-pane').style.display=t==='qr'?'':'none';
	document.getElementById('cookie-pane').style.display=t==='cookie'?'':'none';
	if(t==='qr') createQR();
	else stopQRPoll();
}
// Tao QR moi + bat dau polling.
async function createQR(){
	document.getElementById('qr-loading').style.display='';
	document.getElementById('qr-img').style.display='none';
	document.getElementById('qr-expire').style.display='none';
	document.getElementById('qr-err').style.display='none';
	try{
		var r=await fetch('/api/qr/create');var d=await r.json();
		if(!d.ok||!d.data){throw new Error(d.error||'tao QR that bai')}
		qrToken=d.data.token;
		document.getElementById('qr-img').src=d.data.image;
		document.getElementById('qr-img').style.display='';
		document.getElementById('qr-loading').style.display='none';
		// Poll sau 1.5s
		setTimeout(pollQR,1500);
	}catch(e){
		document.getElementById('qr-loading').style.display='none';
		var er=document.getElementById('qr-err');er.textContent=e.message||String(e);er.style.display='';
	}
}
// Poll QR. Khi thanh cong -> reload page.
async function pollQR(){
	if(!qrToken)return;
	try{
		var r=await fetch('/api/qr/poll?token='+encodeURIComponent(qrToken));var d=await r.json();
		if(d.ok&&d.data&&d.data.pending){
			setTimeout(pollQR,1500);return;
		}
		if(d.ok&&d.data&&d.data.accountId){
			// Login thanh cong!
			stopQRPoll();hideAddModal();window.location.reload();return;
		}
		// Loi: hien thi
		if(!d.ok){
			document.getElementById('qr-expire').style.display='';
			stopQRPoll();
			return;
		}
	}catch(e){console.log('poll err',e)}
	setTimeout(pollQR,1500);
}
function stopQRPoll(){if(qrPollTimer){clearTimeout(qrPollTimer);qrPollTimer=null}qrToken=''}

// Submit cookie login.
async function submitCookie(){
	var ta=document.getElementById('cookie-input');
	var er=document.getElementById('cookie-err');
	er.style.display='none';
	if(!ta.value.trim()){er.textContent='Chua nhap cookie';er.style.display='';return}
	try{
		var r=await fetch('/api/login/cookie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookies:ta.value})});
		var d=await r.json();
		if(d.ok){
			hideAddModal();window.location.reload();
		}else{
			er.textContent=d.error||'Login that bai';er.style.display='';
		}
	}catch(e){er.textContent=String(e);er.style.display=''}
}

// Backward compat: la() goi loadAccounts de giu signature cu.
async function la(){return loadAccounts()}
function uh(){if(!ca)return;fetch('/api/account?accountId='+ca).then(function(r){return r.json()}).then(function(d){if(d.ok&&d.data){var img=document.getElementById('himg');if(d.data.avatar){img.src=d.data.avatar;img.style.display=''}else{img.style.display='none'}document.getElementById('hdn').textContent=d.data.displayName||''}}).catch(function(){})}

// renderAck trả về badge cho delivery ack (tin server chỉ xác nhận gửi/nhận/xem).
// status: "sent" (mặc định — server đã nhận), "delivered", "seen", "unsent".
// ackId: globalDelMsgId từ Zalo (nếu có) để debug.
function renderAck(m){
  var st=m.ackStatus||'sent';
  var labels={sent:'Đã gửi',delivered:'Đã nhận',seen:'Đã xem',unsent:'Thu hồi'};
  var ic={sent:'✓',delivered:'✓✓',seen:'✓✓',unsent:'⟲'};
  var lb=labels[st]||('Đã gửi'+(st?(' ('+st+')'):' (chưa rõ)'));
  var icn=ic[st]||'✓';
  var dv=document.createElement('div');
  dv.className='msg ack '+st;
  dv.dataset.msg=m.id;
  var t=new Date(m.timestamp);
  var ts=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  var hint='';
  if(st==='sent'&&(!m.ackStatus||!m.ackId)) hint=' — chưa rõ trạng thái';
  var idPart=m.ackId?' <span class="ack-id">#'+esc(m.ackId)+'</span>':'';
  dv.innerHTML='<span class="ack-ic">'+icn+'</span><span class="ack-tx">'+esc(lb)+esc(hint)+'</span>'+idPart+'<div class="tm">'+ts+'</div>';
  return dv;
}

function renderMsg(m){
  // Nếu server đánh dấu đây là delivery ack → render badge thay vì text thô.
  if(m.isAck||(m.content&&m.content.charAt(0)==='['&&m.content.indexOf('actionType')>=0)){
    return renderAck(m);
  }
  var dv=document.createElement('div');dv.className='msg '+(m.fromId===ca?'out':'in');dv.dataset.msg=m.id;
  var t=new Date(m.timestamp);
  var ts=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  var fn=(m.fromName&&m.fromId!==ca)?m.fromName:(cvCache[m.fromId]?cvCache[m.fromId].name:'');
  var body='';
  body+=renderAttachments(m.attachments||[],m.id,m.convId||cc);
  body+=esc(m.content||'');
  dv.innerHTML=(fn?'<div class="nm">'+esc(fn)+'</div>':'')+body+'<div class="tm">'+ts+'</div>';
  return dv;
}

// imageExt: đuôi ảnh browser hiểu được. Trả về ext nếu là ảnh, '' nếu không.
function imageExt(nameOrUrl){
  var ext=(nameOrUrl||'').split('.').pop().toLowerCase().split('?')[0].split('#')[0];
  if(['jpg','jpeg','png','gif','webp','bmp'].indexOf(ext)>=0) return ext;
  return '';
}
function videoExt(nameOrUrl){
  var ext=(nameOrUrl||'').split('.').pop().toLowerCase().split('?')[0].split('#')[0];
  if(['mp4','webm','mov','m4v'].indexOf(ext)>=0) return ext;
  return '';
}
// localMediaUrl: nếu url đã trỏ về /media/ thì dùng luôn, không tải lại.
function localMediaUrl(url){
  if(!url) return '';
  if(url.charAt(0)==='/'&&url.indexOf('/media/')===0) return url;
  return '';
}
// renderAttachments: trả HTML cho mọi attachment của 1 message.
// Ảnh: <img> grid (1 ảnh max 320px, 2-3 ảnh 2 cột vuông, 4+ ảnh 3 cột).
//       URL Zalo CDN → auto POST /api/media/download để proxy về /media/.
// Video: <video controls>. File khác: <a> tải về.
function renderAttachments(atts,msgId,convId){
  if(!atts||!atts.length) return '';
  var imgs=[],vids=[],files=[];
  for(var i=0;i<atts.length;i++){
    var a=atts[i];if(!a||!a.url) continue;
    var id=a.id||'';
    // Bỏ variant kích thước: -hdUrl/-oriUrl/-thumbUrl/-thumb/-normalUrl.
    if(/-(hdUrl|oriUrl|thumbUrl|thumb|normalUrl)$/.test(id)) continue;
    var ie=imageExt(a.fileName||a.url);
    var ve=videoExt(a.fileName||a.url);
    if(ie){imgs.push({url:a.url,fileName:a.fileName,id:imgBaseId(id),ie:ie})}
    else if(ve){vids.push({url:a.url,fileName:a.fileName,id:vidBaseId(id),ve:ve})}
    else{files.push({url:a.url,fileName:a.fileName,fileSize:a.fileSize,id:id})}
  }
  var html='';
  if(imgs.length){html+=renderImageGrid(imgs,msgId,convId)}
  for(var j=0;j<vids.length;j++){
    var v=vids[j];
    var vSrc=localMediaUrl(v.url)||v.url;
    html+='<video class="media" controls preload="metadata" src="'+esc(vSrc)+'"></video>';
  }
  for(var k=0;k<files.length;k++){
    var f=files[k];
    var fSrc=localMediaUrl(f.url)||f.url;
    var label=f.fileName||'Tải file';
    if(f.fileSize){label+=' ('+humanSize(f.fileSize)+')'}
    html+='<a class="file" href="'+esc(fSrc)+'" target="_blank" rel="noopener">'+esc(label)+'</a>';
  }
  return html;
}
function imgBaseId(id){var i=id.lastIndexOf('-');return i>0?id.substring(0,i):id;}
function vidBaseId(id){var i=id.lastIndexOf('-');return i>0?id.substring(0,i):id;}
function humanSize(n){
  if(!n||n<1024) return n+'B';
  if(n<1024*1024) return Math.round(n/1024)+'KB';
  if(n<1024*1024*1024) return Math.round(n/1024/1024)+'MB';
  return (n/1024/1024/1024).toFixed(1)+'GB';
}
// renderImageGrid: render 1-n ảnh theo layout responsive.
function renderImageGrid(imgs,msgId,convId){
  var cls='imgs imgs-'+(imgs.length<=1?'1':imgs.length<=3?'2-3':'4p');
  var html='<div class="'+cls+'">';
  for(var i=0;i<imgs.length;i++){
    var a=imgs[i];
    var local=localMediaUrl(a.url);
    var src=local||a.url;
    var dn=local?'':' data-zalo="1" data-fname="'+esc(a.fileName||'')+'" data-ext="'+esc(a.ie)+'"';
    html+='<img class="img" loading="lazy" src="'+esc(src)+'" alt="'+esc(a.fileName||'')+'"'+dn;
    html+=' onclick="openLightbox(this)" onerror="imgErr(this)" data-mid="'+esc(msgId)+'" data-cid="'+esc(convId)+'">';
  }
  html+='</div>';
  return html;
}
// imgErr: ảnh Zalo CDN load fail → tự download về server rồi swap src sang /media/.
function imgErr(img){
  if(img.dataset.zalo!=='1'){img.style.display='none';return}
  img.dataset.zalo='2';
  var mid=img.dataset.mid,cid=img.dataset.cid,fname=img.dataset.fname||'',ext=img.dataset.ext||'jpg';
  var url=img.getAttribute('src');
  var ph=document.createElement('div');ph.className='img-spinner';ph.textContent='Đang tải...';
  img.parentNode.insertBefore(ph,img);img.style.display='none';
  fetch('/api/media/download',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({accountId:ca,convId:cid,url:url,fileName:fname,fileExt:ext,msgId:mid})
  }).then(function(r){return r.json()}).then(function(d){
    if(d.ok&&d.data&&d.data.url){
      var local=d.data.url;
      var sels='.img[data-mid="'+cssEsc(mid)+'"][data-cid="'+cssEsc(cid)+'"][src="'+cssEsc(url)+'"]';
      document.querySelectorAll(sels).forEach(function(el){
        el.src=local;el.dataset.zalo='';el.style.display='';
      });
      if(ph&&ph.parentNode) ph.parentNode.removeChild(ph);
    }else{
      ph.textContent='Lỗi tải ảnh';ph.className='img-err';
    }
  }).catch(function(){
    ph.textContent='Lỗi tải ảnh';ph.className='img-err';
  });
}
function cssEsc(s){return String(s||'').replace(/["\\]/g,'\\$&')}
// openLightbox: phóng to ảnh khi click. Esc/click backdrop đóng.
var lbEl=null;
function openLightbox(img){
  if(!lbEl){
    lbEl=document.createElement('div');lbEl.className='lb';
    lbEl.innerHTML='<div class="lb-bg" onclick="closeLightbox()"></div><img class="lb-img" alt=""><div class="lb-cap"></div>';
    document.body.appendChild(lbEl);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox()});
  }
  lbEl.querySelector('.lb-img').src=img.src;
  lbEl.querySelector('.lb-cap').textContent=img.alt||'';
  lbEl.classList.add('on');
}
function closeLightbox(){if(lbEl) lbEl.classList.remove('on')}
// applyMediaDownloaded: server báo đã tải xong media của 1 message. Swap src.
function applyMediaDownloaded(data){
  if(!data||!data.msgId) return;
  var local=data.url;
  document.querySelectorAll('#ml .msg[data-msg="'+cssEsc(data.msgId)+'"] .img[data-zalo]').forEach(function(el){
    if(local){el.src=local;el.dataset.zalo=''}
  });
}

// lm(manual) — load thêm tin cũ. manual=true khi user click button.
// Khi cuộn lên đầu thread (scrollTop <= 80px) sẽ tự gọi.
// Giữ vị trí scroll: trước khi append lưu scrollHeight, sau khi append
// bù lại phần chênh lệch để tin đang đọc không bị giật.
async function lm(manual){
  if(!cc||ld||!ca||cuEnd)return;
  ld=true;
  var ml=document.getElementById('ml');
  var btn=document.getElementById('lm-btn');
  var load=document.getElementById('lm-load');
  if(manual){
    // click thủ công: không cần preserve scroll (user đang ở đầu rồi).
    if(btn){btn.className='lm-load';btn.textContent='Đang tải...';btn.onclick=null;}
  }else{
    // auto-scroll trigger: chèn spinner tạm ở đầu để tránh nhảy layout.
    if(!load){load=document.createElement('div');load.id='lm-load';load.className='lm-load';load.textContent='Đang tải...';ml.insertBefore(load,ml.firstChild);}
  }
  try{
    var r=await fetch('/api/messages?accountId='+ca+'&convId='+cc+'&cursor='+cu+'&limit=30');
    var d=await r.json();
    if(d.ok&&d.data&&d.data.length>0){
      var oldH=ml.scrollHeight,oldT=ml.scrollTop;
      if(cu===0){el('ml','');ml=document.getElementById('ml');}
      // Chèn tin cũ vào đầu, giữ nguyên các node hiện tại.
      var frag=document.createDocumentFragment();
      d.data.forEach(function(m){frag.appendChild(renderMsg(m))});
      // Sau khi xóa spinner (nếu có), chèn fragment lên đầu.
      var sp=document.getElementById('lm-load');if(sp)sp.remove();
      ml.insertBefore(frag,ml.firstChild);
      // Bù scroll để giữ vị trí.
      var newH=ml.scrollHeight;
      if(cu===0){
        // First load: cuộn xuống cuối.
        ml.scrollTop=ml.scrollHeight;
      }else{
        ml.scrollTop=oldT+(newH-oldH);
      }
      cu=d.data[d.data.length-1].timestamp;
      // Nếu batch đầy → vẫn còn tin cũ hơn → giữ button.
      // Nếu batch < limit → hết → đổi sang thông báo end.
      if(d.data.length<30){
        cuEnd=true;
        if(btn){btn.remove();}
        var end=document.createElement('div');end.className='lm-end';end.textContent='Đã tải hết lịch sử';
        ml.insertBefore(end,ml.firstChild);
      }else if(btn){
        btn.className='lm';btn.textContent='Tải tin nhắn cũ';btn.onclick=function(){lm(true);};
      }
    }else{
      cuEnd=true;
      var sp=document.getElementById('lm-load');if(sp)sp.remove();
      if(btn){btn.remove();}
      var end=document.createElement('div');end.className='lm-end';end.textContent='Đã tải hết lịch sử';
      ml.insertBefore(end,ml.firstChild);
    }
  }catch(e){
    var sp=document.getElementById('lm-load');if(sp)sp.remove();
    if(btn){btn.className='lm';btn.textContent='Tải tin nhắn cũ (thử lại)';btn.onclick=function(){lm(true);};}
  }finally{ld=false;}
}
// Auto-load khi cuộn lên đầu thread.
document.addEventListener('DOMContentLoaded',function(){
  var ml=document.getElementById('ml');
  ml.addEventListener('scroll',function(){
    if(ml.scrollTop<=80&&!ld&&!cuEnd&&cc){lm(false);}
  });
});
